# Custom Chain Configuration Template
# This allows users to deploy Hyperlane with custom chain names

global:
  registry_mode: "local"
  # Set to "local" to support custom chains with registry generation

chains:
  # Example custom chain configuration
  # Users can replace these with their actual chain details
  - name: "cheerful-owl"
    chain_id: 1270386
    rpc_url: "https://251d4e5fef9f40d99a95a7c83fd436ad-rpc.network.bloctopus.internal"
    deploy_core: true
    # Chain metadata for registry generation
    metadata:
      displayName: "Cheerful Owl"
      protocol: "ethereum"
      nativeToken:
        symbol: "ETH"
        name: "Ether"
        decimals: 18
  
  - name: "ambitious-porcupine"
    chain_id: 5621538
    rpc_url: "https://8be812304ebf47deaa95c57acef68d5b-rpc.network.bloctopus.internal"
    deploy_core: true
    metadata:
      displayName: "Ambitious Porcupine"
      protocol: "ethereum"
      nativeToken:
        symbol: "ETH"
        name: "Ether"
        decimals: 18

agents:
  deployer:
    key: "0x5dc7c8b920ab6d966d190127e9e6f20070d9ff6f9c97c8279eb7ca22d7ff00ee"
  
  relayer:
    key: "0x5dc7c8b920ab6d966d190127e9e6f20070d9ff6f9c97c8279eb7ca22d7ff00ee"
  
  validators:
    - chain: "cheerful-owl"
      signing_key: "0x5dc7c8b920ab6d966d190127e9e6f20070d9ff6f9c97c8279eb7ca22d7ff00ee"
      checkpoint_syncer:
        type: "localStorage"
        params:
          path: "/tmp/checkpoints"
    
    - chain: "ambitious-porcupine"  
      signing_key: "0x5dc7c8b920ab6d966d190127e9e6f20070d9ff6f9c97c8279eb7ca22d7ff00ee"
      checkpoint_syncer:
        type: "localStorage"
        params:
          path: "/tmp/checkpoints"

# ISM Configuration - Default to multisig for security
default_ism:
  type: "messageIdMultisigIsm"
  validators: 
    - "0xe1A74e1FCB254CB1e5eb1245eaAe034A4D7dD538"  # Derived from key above
  threshold: 1

# Test configuration
send_test:
  enabled: false

# Warp routes (empty for basic setup)
warp_routes: []